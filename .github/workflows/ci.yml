name: Tests and Windows preview

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Compile modules
        run: python -m compileall -q spindle app.py
  build-preview:
    if: github.event_name != 'pull_request'
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller>=6.11
      - name: Build standalone Windows preview
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Spindle --hidden-import=keyring.backends.Windows --collect-submodules winsdk --collect-submodules uiautomation --collect-submodules comtypes app.py
      - name: Package preview
        shell: pwsh
        run: Compress-Archive -Path 'dist/Spindle/*' -DestinationPath 'Spindle-Windows-preview.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Spindle-Windows-preview
          path: Spindle-Windows-preview.zip
          retention-days: 14
